# v8 多季节负样本微调（对照 v7：监督不变，负样本库 676→1481，
# 新增 round4 亮斑点域 + round5 秋季 5 景普查负样本——一次性覆盖
# 噪声域多样性的路线，替代逐轮热修；热加载 v7）

experiment_name: swin_unet_v8_negmix5
seed: 42

data:
  config: code/configs/data.yaml
  dataset: tao2022_negmix5_sam
  train_split: 0.8
  num_workers: 4

model:
  config: code/configs/model_swin_v8.yaml

train:
  epochs: 20
  batch_size: 4
  grad_accum_steps: 8
  amp: true
  lr: 0.00005
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 1
  oversample_stripe: true

loss:
  focal_tversky: {alpha: 0.3, beta: 0.7, gamma: 1.333, weight: 1.0}
  cldice: {weight: 0.5, iters: 10}
  mcc: {weight: 0.5}

eval:
  metrics: [dice, iou, f1, far]
  stripe_tolerance_px: 3

logging:
  log_dir: logs
  ckpt_dir: checkpoints/experiments
  save_every_epoch: 5
