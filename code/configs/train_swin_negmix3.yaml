# v5 负样本扩充微调（对照 v4：新增 round3 自动判读裁块——4 景留出场景
# 全部 v4@0.6 检出由条纹纹理 fine_ratio 自动打标，替代人工判读；
# 低风区噪声大暗斑等新类型负样本入库）

experiment_name: swin_unet_v5_negmix3
seed: 42

data:
  config: code/configs/data.yaml
  dataset: tao2022_negmix3
  train_split: 0.8
  num_workers: 4

model:
  config: code/configs/model_swin_negmix3.yaml

train:
  epochs: 20
  batch_size: 4
  grad_accum_steps: 8
  amp: true
  lr: 0.00005
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 1
  oversample_stripe: true

loss:
  focal_tversky: {alpha: 0.3, beta: 0.7, gamma: 1.333, weight: 1.0}
  cldice: {weight: 0.5, iters: 10}
  mcc: {weight: 0.5}

eval:
  metrics: [dice, iou, f1, far]
  stripe_tolerance_px: 3

logging:
  log_dir: logs
  ckpt_dir: checkpoints/experiments
  save_every_epoch: 5
