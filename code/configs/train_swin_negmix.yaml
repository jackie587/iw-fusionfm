# 负样本混合微调实验（对照 swin_unet_v2，仅换数据集+初始化+微调超参）
# 动机：真实海况人工判读 FAR=54.7%（0604 近岸景 ~100%，0930 远海景 26.3%），
# 把 122 个人工确认虚警裁块（空掩膜）+ 101 个真内波裁块（检出区伪标签）
# 混入 Tao 训练集微调。验证集与 v2 严格一致（裁块只进训练集）。

experiment_name: swin_unet_v3_negmix
seed: 42

data:
  config: code/configs/data.yaml
  dataset: tao2022_negmix
  train_split: 0.8
  num_workers: 4

model:
  config: code/configs/model_swin_negmix.yaml

train:
  epochs: 20                  # 微调不需要 50 epoch
  batch_size: 4
  grad_accum_steps: 8
  amp: true
  lr: 0.00005                 # 微调学习率（v2 是 3e-4）
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 1
  oversample_stripe: true

loss:
  focal_tversky: {alpha: 0.3, beta: 0.7, gamma: 1.333, weight: 1.0}
  cldice: {weight: 0.5, iters: 10}
  mcc: {weight: 0.5}

eval:
  metrics: [dice, iou, f1, far]
  stripe_tolerance_px: 3

logging:
  log_dir: logs
  ckpt_dir: checkpoints/experiments
  save_every_epoch: 5
