# v6 负样本扩充微调（对照 v5：新增 round4——未见场景 D11C 的 150 个
# AI 目视判读裁块，含 132 个新噪声域硬负样本；1F40_COG 场景保持
# 完全不进训练，留作最终诚实检验）

experiment_name: swin_unet_v6_negmix4
seed: 42

data:
  config: code/configs/data.yaml
  dataset: tao2022_negmix4
  train_split: 0.8
  num_workers: 4

model:
  config: code/configs/model_swin_negmix4.yaml

train:
  epochs: 20
  batch_size: 4
  grad_accum_steps: 8
  amp: true
  lr: 0.00005
  weight_decay: 0.01
  scheduler: cosine
  warmup_epochs: 1
  oversample_stripe: true

loss:
  focal_tversky: {alpha: 0.3, beta: 0.7, gamma: 1.333, weight: 1.0}
  cldice: {weight: 0.5, iters: 10}
  mcc: {weight: 0.5}

eval:
  metrics: [dice, iou, f1, far]
  stripe_tolerance_px: 3

logging:
  log_dir: logs
  ckpt_dir: checkpoints/experiments
  save_every_epoch: 5
